name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: deploy
        uses: ./.github/actions/deploy-amplify
        with:
          branch-name: pr-${{ github.event.pull_request.number }}
          aws-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Build preview comment
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "**Style site preview:** ${PREVIEW_URL} (also https://pr-${PR_NUMBER}.style.wootdev.com once DNS settles)"
            echo
            echo "- Guide: ${PREVIEW_URL}/"
            echo "- Showcase: ${PREVIEW_URL}/showcase/"
            echo "- Ledger: ${PREVIEW_URL}/decisions/"
          } > "$RUNNER_TEMP/preview-comment.md"

      - name: Comment preview URL on PR
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: ${{ runner.temp }}/preview-comment.md
        with:
          script: |
            const fs = require("node:fs");
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = "<!-- amplify-preview-url -->";
            const body = marker + "\n" + fs.readFileSync(process.env.COMMENT_FILE, "utf8");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
