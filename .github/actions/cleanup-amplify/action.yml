name: Cleanup Amplify Branch
description: Delete an Amplify branch (and any auto-created subdomain) when a PR closes.

inputs:
  branch-name:
    description: Amplify branch to delete (e.g. "pr-42")
    required: true
  aws-region:
    description: AWS region
    required: false
    default: us-west-2
  aws-role-arn:
    description: IAM role ARN to assume via OIDC
    required: true
  app-id-ssm-name:
    description: SSM parameter name holding the Amplify App ID
    required: false
    default: /product-style/amplify/app-id

runs:
  using: composite
  steps:
    - name: Guard against deleting protected branches
      shell: bash
      env:
        BRANCH: ${{ inputs.branch-name }}
      run: |
        case "$BRANCH" in
          main|prod|production)
            echo "Refusing to delete protected branch: $BRANCH"
            exit 1
            ;;
        esac

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Delete branch (idempotent)
      shell: bash
      env:
        SSM_NAME: ${{ inputs.app-id-ssm-name }}
        BRANCH: ${{ inputs.branch-name }}
      run: |
        APP_ID=$(aws ssm get-parameter --name "$SSM_NAME" --query 'Parameter.Value' --output text)
        if aws amplify get-branch --app-id "$APP_ID" --branch-name "$BRANCH" >/dev/null 2>&1; then
          aws amplify delete-branch --app-id "$APP_ID" --branch-name "$BRANCH"
          echo "Deleted branch $BRANCH"
        else
          echo "Branch $BRANCH already gone — nothing to do."
        fi
