<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Saga product style</title>
<meta name="description" content="{{summary}}">
<link rel="icon" href="/assets/brand/saga-s-for-light-bgs.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/site.css">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
</head>
<body class="site">
<a class="skip" href="#main">Skip to content</a>
<nav class="site-nav saga-nav" aria-label="Guide">
	<a class="saga-nav__logo site-nav__home" href="/"><img src="/assets/brand/saga-logo-white.png" alt="Saga" width="96"></a>
	<div class="saga-nav__section">Guide</div>
	<ul class="site-nav__list">
		{{nav}}
	</ul>
	<div class="saga-nav__section">Reference</div>
	<ul class="site-nav__list">
		<li><a href="/showcase/">Component showcase</a></li>
		<li><a href="/decisions/">Decisions ledger</a></li>
		<li><a href="/css/tokens.css">tokens.css</a></li>
		<li><a href="/starter/saga-starter.html" download>Starter template</a></li>
		<li><a href="https://github.com/saga-ed/product-style">GitHub</a></li>
	</ul>
	<div class="saga-nav__footer site-nav__build">{{buildInfo}}</div>
</nav>
<main id="main" class="site-main">
	<article class="site-article">
		<h1>{{title}}</h1>
		<p class="site-summary">{{summary}}</p>
		{{content}}
	</article>
</main>
</body>
</html>
